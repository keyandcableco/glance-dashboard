# Copy to config.toml and fill in. config.toml is git-ignored.
# The first clock listed is the default for anything that doesn't name one.

port = 8740

# Optional: a shop app API for "hey glance, clock me in", "working on the Juno",
# "waiting on Sam's approval" (see README, "A shop app").
# [shop_app]
# url = "http://192.168.1.50:8001"
# followup_hours = [10, 15]   # when to nag about follow-ups that are due

[clocks.office]
address = "AA:BB:CC:DD:EE:FF"   # bluetoothctl devices, after pairing (see README)
# status_ring = false           # start with the status ring screen off (the panel's Screens switch it)
# schedule_ring = false         # start with the schedule ring screen off
# animation_screen = false      # start with the animation screen (burn-in fire, holidays) off
# screensaver = true            # start with the screensaver screen (a different animation each turn) on

# Optional: Claude's face, a screen showing how your Claude Code sessions are doing. It needs a session
# tracker you write: a Python file, run inside the bridge, with a SessionRing class whose refresh(now)
# (now in epoch seconds) sets .counts to how many sessions are in "error", "waiting", "waitingSeen",
# "done" and "running", say from files your Claude Code hooks write (see claudeface.py).
# [clocks.office.claude_face]
# tracker = "~/claude-sessions/sessionring.py"

# Optional: alert on emails in a Thunderbird inbox (its local mbox file).
[clocks.office.mail]
inbox = "~/.thunderbird/xxxxxxxx.default-release/ImapMail/imap.example.com/INBOX"
sender = "no-reply@example.com"
rules = [
  # match = a regex on the subject; its first group, if any, is shown after the label
  { match = '^New order \S+ from (.+)', label = "ORDER", color = "Lime", anim = "Pulse", sound = "Bells" },
  { match = '^New Service Request from (.+)', label = "REQUEST", color = "RoyalBlue", anim = "Wave", sound = "Radar" },
]

# Optional: alert on desktop notifications (e.g. Google Messages for Web) whose title has one of these names.
[clocks.office.texts]
names = ["Alex"]

# Optional: warnings before Google Calendar events. Calendars are easiest to add and remove on the panel
# (kept in calendars-<name>.json, git-ignored). One can also start here: put the calendar's
# "Secret address in iCal format" in this file (one line, git-ignored).
# [clocks.office.calendar]
# url_file = "calendar_url"
# name = "Calendar"   # what the panel calls it

# Optional: a 24-hour forecast drawn around the ring.
[clocks.office.forecast]
latitude = 40.0
longitude = -75.0
show = "humidity"   # humidity | temperature | rain
source = "nws"      # nws (US, any use) | open-meteo (worldwide, non-commercial use only)
# every_minutes = 10  # on the clock for the first show_minutes of every every_minutes;
# show_minutes = 2    # every_minutes = 0 keeps it on all the time

# Optional: hyperfocus nudges (the panel can change these later).
[clocks.office.nudges]
break_minutes = 75
pause_minutes = 10
# closing = "18:00"
# closing_days = ["Mon", "Tue", "Wed", "Thu", "Fri"]

# A second clock with nothing but what you send it.
# [clocks.kitchen]
# address = "11:22:33:44:55:66"
